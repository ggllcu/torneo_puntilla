# Deploys to Cloudflare (https://puntilla.87c21.workers.dev) on every push to master.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and KV edit on the account).
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Database migrations
        run: npx wrangler d1 migrations apply puntilla --remote

      - name: Deploy
        run: npx wrangler deploy
